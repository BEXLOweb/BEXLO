<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Test | Tier Test - لوحة بيانات اللاعبين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ffb300;
            --primary-dark: #e6a100;
            --background: #0b0d12;
            --card-bg: #151a24;
            --card-border: #262c3a;
            --header-bg: #0f131a;
            --text-light: #e0e0e0;
            --text-dim: #aaa;
            --success: #4CAF50;
            --danger: #f44336;
            --warning: #ff9800;
            --info: #2196F3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: #fff;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 179, 0, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 80% 20%, rgba(255, 179, 0, 0.03) 0%, transparent 20%);
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, var(--header-bg) 0%, #1a1f2e 100%);
            border-bottom: 2px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #ff7043, var(--primary));
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 2.2rem;
            text-shadow: 0 2px 10px rgba(255, 179, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            color: var(--text-dim);
            margin-top: 5px;
            font-size: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--card-border);
        }

        .tabs button {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-light);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tabs button:hover {
            background: rgba(255, 179, 0, 0.1);
            transform: translateY(-2px);
        }

        .tabs button.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(255, 179, 0, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .search {
            width: 100%;
            padding: 14px 45px 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(255, 179, 0, 0.2);
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: rgba(255, 179, 0, 0.1);
        }

        #players {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .player {
            background: linear-gradient(145deg, #1a1f2e, #151a24);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .player:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .rank {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            overflow: hidden;
            background: #333;
            border: 3px solid var(--card-border);
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            flex: 1;
        }

        .name {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .role {
            font-size: 0.9rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .player-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .meta-value {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-light);
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .ip-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            border: 1px dashed var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ip-label {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .ip-address {
            font-family: monospace;
            font-size: 1rem;
            color: var(--primary);
            direction: ltr;
        }

        .copy-ip {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-light);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .copy-ip:hover {
            background: var(--primary);
            color: #000;
        }

        .tiers-section {
            margin-top: 15px;
        }

        .tiers-title {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .tiers {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .tier-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50px;
        }

        .tier {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--warning);
            opacity: 0.3;
            margin-bottom: 5px;
            position: relative;
        }

        .tier.active {
            opacity: 1;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.7);
        }

        .tier-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
        }

        .points {
            background: linear-gradient(135deg, #1a2030, #252d42);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 15px;
            text-align: center;
            border: 1px solid rgba(255, 179, 0, 0.2);
        }

        .player-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mode-badge {
            background: rgba(255, 179, 0, 0.1);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.offline {
            background: var(--danger);
        }

        footer {
            text-align: center;
            padding: 25px;
            background: var(--header-bg);
            color: var(--text-dim);
            margin-top: 40px;
            border-top: 1px solid var(--card-border);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-dim);
            font-size: 1.2rem;
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--card-border);
        }

        /* تأثيرات للاعبين الأوائل */
        .player:nth-child(1) .rank {
            background: linear-gradient(135deg, #ffd700, #ffb300);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .player:nth-child(2) .rank {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.4);
        }

        .player:nth-child(3) .rank {
            background: linear-gradient(135deg, #cd7f32, #b06c28);
            box-shadow: 0 0 15px rgba(205, 127, 50, 0.4);
        }

        /* تحسينات للجوال */
        @media (max-width: 768px) {
            #players {
                grid-template-columns: 1fr;
            }
            
            .search-box {
                min-width: 100%;
            }
            
            .stats-bar {
                justify-content: center;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
